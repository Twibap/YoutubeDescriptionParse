[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "youtube-description-parse"
version = "0.1.0"
description = "YouTube 영상 설명의 식당정보를 출처와 함께 수집하는 CLI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "yt-dlp[default,deno]>=2025.1.26,<2027",
  "tqdm>=4.67.1,<5",
]

[project.scripts]
youtube-description-parse = "youtube_description_parse.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_description_parse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
indent-style = "space"
